name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake ccache curl

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer python-for-android cython virtualenv

      - name: Override urlretrieve Globally with Curl
        run: |
          SITE_PKG=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cat << 'EOF' > "$SITE_PKG/sitecustomize.py"
          import urllib.request, subprocess, os
          def custom_urlretrieve(url, filename=None, reporthook=None, data=None):
              print('>>> FETCHING URL:', url, flush=True)
              if filename:
                  os.makedirs(os.path.dirname(os.path.abspath(filename)), exist_ok=True)
                  res = subprocess.run(['curl', '-f', '-s', '-S', '-L', '-A', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36', url, '-o', filename])
                  if res.returncode == 0 and os.path.exists(filename) and os.path.getsize(filename) > 0:
                      return (filename, {})
              raise Exception(f'Curl failed for {url}')
          urllib.request.urlretrieve = custom_urlretrieve
          EOF
          echo "Patched sitecustomize.py in $SITE_PKG"


      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primary-School-Panauta-APK
          path: bin/*.apk

name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake ccache

      - name: Install Latest Buildozer & P4A Develop Branch
        run: |
          pip install --upgrade pip
          pip install "https://github.com"
          pip install "https://github.com"
          pip install cython==0.29.36 virtualenv

      - name: Fix Urllib 403 User-Agent Globally
        run: |
          python -c "import site, os; sp = site.getsitepackages()[0]; open(os.path.join(sp, 'sitecustomize.py'), 'w').write('import urllib.request\nopener = urllib.request.build_opener()\nopener.addheaders = [(\"User-agent\", \"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36\")]\nurllib.request.install_opener(opener)\n')"

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primary-School-Panauta-APK
          path: bin/*.apk

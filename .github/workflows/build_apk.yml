name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake ccache

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer python-for-android cython==0.29.36 virtualenv

      - name: Patch 403 Forbidden Links & User-Agent
        run: |
          python -c "import site, os; sp = site.getsitepackages(); open(os.path.join(sp, 'sitecustomize.py'), 'w').write('import urllib.request\nopener = urllib.request.build_opener()\nopener.addheaders = [(\"User-agent\", \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\")]\nurllib.request.install_opener(opener)\n')"
          python -c "import site, os; p4a = os.path.join(site.getsitepackages(), 'pythonforandroid', 'recipes'); [open(os.path.join(r, f), 'w').write(open(os.path.join(r, f)).read().replace('download.savannah.nongnu.org/releases/freetype', 'sourceforge.net/projects/freetype/files/freetype2/2.13.2').replace('http://', 'https://')) for r, d, files in os.walk(p4a) for f in files if f == '__init__.py']"

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primary-School-Panauta-APK
          path: bin/*.apk

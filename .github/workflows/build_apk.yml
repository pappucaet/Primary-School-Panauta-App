name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake ccache curl

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer python-for-android cython virtualenv

      - name: Patch P4A Downloader with Curl & URL Logger
        run: |
          python -c "
          import pythonforandroid, os
          p4a_dir = os.path.dirname(pythonforandroid.__file__)
          rec_file = os.path.join(p4a_dir, 'recipe.py')
          txt = open(rec_file).read()
          old_code = 'urlretrieve(url, target, report_hook)'
          new_code = '''print('>>> DOWNLOADING URL:', url); os.system(f'curl -L -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0\" \"{url}\" -o \"{target}\"') if os.system(f'curl -f -L -A \"Mozilla/5.0\" \"{url}\" -o \"{target}\"') == 0 else urlretrieve(url, target, report_hook)'''
          txt = txt.replace(old_code, new_code)
          open(rec_file, 'w').write(txt)
          print('P4A Downloader Patched with Curl!')
          "

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primary-School-Panauta-APK
          path: bin/*.apk
